<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="River Thames Evidence Programme mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/><stop offset=".62" stop-color="#13315c"/><stop offset="1" stop-color="#0b565f"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a4d3"/><stop offset="1" stop-color="#2a6f97"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35a3ad"/><stop offset="1" stop-color="#0f6f7a"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <circle cx="97" cy="30" r="10.5" fill="#8fb8c9" opacity=".55"/>
  
  <!-- Teddington Weir: the tidal limit -->
  <line x1="18" y1="64" x2="110" y2="64" stroke="#ffffff" stroke-width="3.4" stroke-dasharray="9.5 6.5" stroke-linecap="round" opacity=".82"/>
  <!-- freshwater above, tidal water below -->
  <path d="M18 84 Q29.5 76 41 84 T64 84 T87 84 T110 84" fill="none" stroke="url(#w1)" stroke-width="5.6" stroke-linecap="round"/>
  <path d="M18 102 Q29.5 94 41 102 T64 102 T87 102 T110 102" fill="none" stroke="url(#w2)" stroke-width="5.6" stroke-linecap="round"/>
</svg>