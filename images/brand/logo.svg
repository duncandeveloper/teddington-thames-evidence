<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" role="img"
     aria-label="River Thames Evidence and Representation Programme — Teddington to Richmond">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/><stop offset=".62" stop-color="#13315c"/><stop offset="1" stop-color="#0b565f"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a4d3"/><stop offset="1" stop-color="#2a6f97"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35a3ad"/><stop offset="1" stop-color="#0f6f7a"/>
    </linearGradient>
  </defs>
  <g>
    <rect width="128" height="128" rx="28" fill="url(#bg)"/>
    <circle cx="97" cy="30" r="10.5" fill="#8fb8c9" opacity=".55"/>
  <g stroke-linecap="round">
    <!-- legs -->
    <path d="M47.5 53.5 V63.5 M53.5 53 V63.5" fill="none" stroke="#ffffff" stroke-width="2.4" opacity=".92"/>
    <!-- body: rounded teardrop with a tail hint to the left -->
