    <!-- neck: smooth S from shoulder up to the head -->
    <path d="M56 43.5 C52.5 37.5 55.5 29.5 62.5 27.2" fill="none" stroke="#ffffff" stroke-width="5" opacity=".95"/>
    <!-- head + dagger beak, facing right -->
    <circle cx="65.5" cy="26.6" r="3.7" fill="#ffffff" opacity=".95"/>
    <path d="M68.3 25 L80.5 22.6 L68.6 28.9 Z" fill="#ffffff" opacity=".95"/>
  </g>
    <line x1="18" y1="64" x2="110" y2="64" stroke="#ffffff" stroke-width="3.4" stroke-dasharray="9.5 6.5" stroke-linecap="round" opacity=".82"/>
    <path d="M18 84 Q29.5 76 41 84 T64 84 T87 84 T110 84" fill="none" stroke="url(#w1)" stroke-width="5.6" stroke-linecap="round"/>
    <path d="M18 102 Q29.5 94 41 102 T64 102 T87 102 T110 102" fill="none" stroke="url(#w2)" stroke-width="5.6" stroke-linecap="round"/>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
    <text x="152" y="52" font-size="34" font-weight="700" fill="#0b2545" letter-spacing="-.5">River Thames</text>
    <text x="152" y="82" font-size="21" font-weight="600" fill="#13315c">Evidence &amp; Representation Programme</text>
    <text x="152" y="108" font-size="15" fill="#5c6b78" letter-spacing="1.2">TEDDINGTON · HAM · KINGSTON · RICHMOND</text>
  </g>
</svg>