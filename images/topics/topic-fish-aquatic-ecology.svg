<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img"
     aria-label="Stylised illustration of an eel and fish beneath the water surface">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b2545"/><stop offset=".58" stop-color="#13315c"/><stop offset="1" stop-color="#0b565f"/>
    </linearGradient>
    <linearGradient id="fw1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a4d3"/><stop offset="1" stop-color="#2a6f97"/>
    </linearGradient>
    <linearGradient id="fw2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#35a3ad"/><stop offset="1" stop-color="#0f6f7a"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#fbg)"/>
  <circle cx="662" cy="86" r="42" fill="#8fb8c9" opacity=".22"/>

  <!-- surface light -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".13">
    <path d="M40 62 Q140 40 240 62 T440 62 T640 62 T780 62" stroke-width="3"/>
    <path d="M40 84 Q140 62 240 84 T440 84 T640 84 T780 84" stroke-width="2"/>
  </g>

  <!-- eel: the Critically Endangered indicator species of this reach -->
  <path d="M92 300 C170 246 214 350 292 296 C368 244 414 344 492 292 C556 249 596 306 654 288"
        fill="none" stroke="#ffffff" stroke-width="15" stroke-linecap="round" opacity=".93"/>
  <path d="M654 288 l30 -15 l-4 17 l22 10 l-30 8 z" fill="#ffffff" opacity=".93"/>
  <circle cx="104" cy="296" r="4.6" fill="#0b2545" opacity=".85"/>

  <!-- two smaller fish -->
  <g opacity=".55" fill="#cfe0ea">
    <path d="M232 160 q34 -22 68 0 q-34 22 -68 0 z"/>
    <path d="M232 160 l-19 -13 l4 13 l-4 13 z"/>
    <circle cx="288" cy="157" r="3" fill="#13315c"/>
  </g>
  <g opacity=".38" fill="#cfe0ea">
    <path d="M470 196 q26 -17 52 0 q-26 17 -52 0 z"/>
    <path d="M470 196 l-15 -10 l3 10 l-3 10 z"/>
    <circle cx="513" cy="194" r="2.4" fill="#13315c"/>
  </g>

  <!-- bed weed -->
  <g fill="none" stroke="#0f6f7a" stroke-width="6" stroke-linecap="round" opacity=".5">
    <path d="M120 430 q10 -46 -6 -74"/>
    <path d="M150 430 q4 -38 16 -60"/>
    <path d="M680 430 q-10 -44 6 -70"/>
  </g>

  <path d="M0 388 Q100 362 200 388 T400 388 T600 388 T800 388" fill="none" stroke="url(#fw1)" stroke-width="9" stroke-linecap="round" opacity=".75"/>
  <path d="M0 414 Q100 388 200 414 T400 414 T600 414 T800 414" fill="none" stroke="url(#fw2)" stroke-width="9" stroke-linecap="round" opacity=".75"/>
</svg>
